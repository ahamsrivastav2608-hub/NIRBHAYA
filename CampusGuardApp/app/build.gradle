plugins { id 'com.android.application' }

android {
    namespace 'com.campusguard'
    compileSdk 35

    defaultConfig {
        applicationId 'com.campusguard'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.core:core:1.17.0'
}
